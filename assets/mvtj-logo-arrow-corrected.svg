<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">MVTJ Designs Logo</title>
  <desc id="desc">Transparent MVTJ Designs logo with white MVTJ lettering, a gold chevron arrow accent under the V, split gold lines, and spaced gold Designs text.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d99b2b"/>
      <stop offset="55%" stop-color="#cfa258"/>
      <stop offset="100%" stop-color="#c8a46a"/>
    </linearGradient>
  </defs>

  <g font-family="Arial Black, Arial, Helvetica, sans-serif" text-rendering="geometricPrecision">
    <text x="58" y="220" fill="#ffffff" font-size="182" font-weight="900" letter-spacing="38">MVTJ</text>

    <!-- open chevron / arrow accent under the V -->
    <path d="M420 256 L468 320 L516 256" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter"/>

    <rect x="60" y="354" width="350" height="8" fill="url(#gold)"/>
    <rect x="528" y="354" width="348" height="8" fill="url(#gold)"/>

    <text x="96" y="440" fill="url(#gold)" font-size="62" font-weight="500" letter-spacing="34">DESIGNS</text>
  </g>
</svg>
